name: Release macOS Signed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (bijv. v1.5.93)
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-sign-notarize-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN_UPDATER: ${{ secrets.GH_TOKEN_UPDATER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject updater token (optional)
        shell: bash
        run: |
          if [ -n "${GH_TOKEN_UPDATER}" ]; then
            export GH_TOKEN="$GH_TOKEN_UPDATER"
          fi
          npm run inject-update-token

      - name: Build mac artifacts (signed + notarized, of unsigned op CI)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ]; then
            echo "Building met CSC_LINK (signed), arm64 + x64"
            npm run build:mac:release -- --x64 --arm64
          else
            echo "Geen CSC_LINK — unsigned mac build arm64 + x64 (artifacts op release)"
            unset CSC_LINK || true
            unset CSC_KEY_PASSWORD || true
            unset APPLE_ID || true
            unset APPLE_APP_SPECIFIC_PASSWORD || true
            unset APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO=false
            npx electron-builder --mac --publish never --x64 --arm64 \
              --config.mac.identity=null \
              --config.mac.hardenedRuntime=false
          fi

      - name: Ensure release exists
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Shift Happens $TAG" --notes "Pre-release."
          fi

      - name: Upload mac updater metadata + assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          # YML-urls moeten matchen met de GitHub-bestandsnamen (geen spaties).
          node scripts/fix-updater-yml-names.js dist/latest-mac.yml || true
          if [ -f dist/latest-mac.yml ]; then
            python3 - "$VER" <<'PY'
          import pathlib, sys
          ver = sys.argv[1]
          path = pathlib.Path("dist/latest-mac.yml")
          text = path.read_text()
          text = text.replace(f"Shift.Happens-{ver}-mac.zip", f"Shift.Happens-{ver}-x64-mac.zip")
          text = text.replace(f"Shift.Happens-{ver}.dmg", f"Shift.Happens-{ver}-x64.dmg")
          path.write_text(text)
          PY
            cp dist/latest-mac.yml dist/beta-mac.yml
          fi
          stage=dist/gh-upload
          rm -rf "$stage"
          mkdir -p "$stage"
          take() {
            local src="$1"
            local name="$2"
            if [ ! -f "$src" ]; then
              echo "Skip (ontbreekt): $src"
              return 0
            fi
            cp "$src" "$stage/$name"
            echo "Klaar: $name"
          }
          take "dist/latest-mac.yml" "latest-mac.yml"
          take "dist/beta-mac.yml" "beta-mac.yml"
          take "dist/Shift Happens-${VER}-arm64-mac.zip" "Shift.Happens-${VER}-arm64-mac.zip"
          take "dist/Shift Happens-${VER}-arm64-mac.zip.blockmap" "Shift.Happens-${VER}-arm64-mac.zip.blockmap"
          take "dist/Shift Happens-${VER}-arm64.dmg" "Shift.Happens-${VER}-arm64.dmg"
          take "dist/Shift Happens-${VER}-arm64.dmg.blockmap" "Shift.Happens-${VER}-arm64.dmg.blockmap"
          take "dist/Shift Happens-${VER}-x64-mac.zip" "Shift.Happens-${VER}-x64-mac.zip"
          take "dist/Shift Happens-${VER}-x64-mac.zip.blockmap" "Shift.Happens-${VER}-x64-mac.zip.blockmap"
          take "dist/Shift Happens-${VER}-mac.zip" "Shift.Happens-${VER}-x64-mac.zip"
          take "dist/Shift Happens-${VER}-mac.zip.blockmap" "Shift.Happens-${VER}-x64-mac.zip.blockmap"
          take "dist/Shift Happens-${VER}-x64.dmg" "Shift.Happens-${VER}-x64.dmg"
          take "dist/Shift Happens-${VER}-x64.dmg.blockmap" "Shift.Happens-${VER}-x64.dmg.blockmap"
          take "dist/Shift Happens-${VER}.dmg" "Shift.Happens-${VER}-x64.dmg"
          take "dist/Shift Happens-${VER}.dmg.blockmap" "Shift.Happens-${VER}-x64.dmg.blockmap"
          shopt -s nullglob
          files=("$stage"/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Geen mac-bestanden om te uploaden"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
